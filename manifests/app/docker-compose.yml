version: '3.8'

services:
 
  postgres:
    image: postgres:15-alpine
    container_name: idp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - /mnt/main-data/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d root"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idp-network


  vault-service:
    image: ${DOCKERHUB_USERNAME}/vault-service:latest
    container_name: idp-vault-service
    restart: unless-stopped
    ports:
      - "8000:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql+asyncpg://admin:vault@postgres:5432/vault_storage
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:-idp_transit_master_encryption_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-network
 
  auth-service:
    image: ${DOCKERHUB_USERNAME}/auth-service:latest
    container_name: idp-auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-network
 
  db-provisioning-service:
    image: ${DOCKERHUB_USERNAME}/provisioner-service:latest
    container_name: idp-db-provisioning-service
    restart: unless-stopped
    ports:
      - "8002:8001"
    depends_on:
      postgres:
        condition: service_healthy
      vault-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-network

 
  helm-deployer:
    image: ${DOCKERHUB_USERNAME}/helm-service:latest
    container_name: idp-helm-deployer
    restart: unless-stopped
    ports:
      - "8003:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-network
 
  cost-management-service:
    image: ${DOCKERHUB_USERNAME}/cost-service:latest
    container_name: idp-cost-management-service
    restart: unless-stopped
    ports:
      - "8004:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-network
 
  operator-service:
    image: ${DOCKERHUB_USERNAME}/operator-service:latest
    container_name: idp-operator-service
    restart: unless-stopped
    ports:
      - "8005:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-network
 
  discovery-service:
    image: ${DOCKERHUB_USERNAME}/discovery-service:latest
    container_name: idp-discovery-service
    restart: unless-stopped
    ports:
      - "8007:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-network

 
  db-info-service:
    image: ${DOCKERHUB_USERNAME}/info-service:latest
    container_name: idp-db-info-service
    restart: unless-stopped
    ports:
      - "8008:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-network

 
  provider-service:
    image: ${DOCKERHUB_USERNAME}/provider-service:latest
    container_name: idp-provider-service
    restart: unless-stopped
    ports:
      - "8009:8001"
 
    depends_on:
      postgres:
        condition: service_healthy
      vault-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-network
 
  ui:
    image: ${DOCKERHUB_USERNAME}/ui-service:latest
    container_name: idp-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - idp-network

  vault-client:
    image: hashicorp/vault:1.13.3
    container_name: idp-vault-client
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "hvactoken"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - idp-network

  prometheus:
    image: prom/prometheus:latest
    container_name: idp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - idp-network

  grafana:
    image: grafana/grafana:latest
    container_name: idp-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - idp-network

  loki:
    image: grafana/loki:2.9.0
    container_name: idp-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - idp-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: idp-promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - idp-network


volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  idp-network:
    driver: bridge
    name: idp-network

