global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'idp-vault-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['vault-service:8001']

  - job_name: 'idp-auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:8001']

  - job_name: 'idp-provider-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['provider-service:8001']

  - job_name: 'idp-discovery-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['discovery-service:8001']

  - job_name: 'idp-db-provisioning-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['db-provisioning-service:8001']
