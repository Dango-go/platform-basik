apiVersion: apps/v1
kind: Deployment

metadata:
  name: users-service
  namespace: production

  labels:
    app: users-service
    component: backend
    tier: api
    version: v1

  annotations:
    kubernetes.io/change-cause: "Deploy version 1.4.0"

spec:
  replicas: 3

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600

  minReadySeconds: 30

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: users-service

  template:

    metadata:
      labels:
        app: users-service
        component: backend
        tier: api
        version: v1

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"

    spec:

      serviceAccountName: users-service

      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 30

      dnsPolicy: ClusterFirst

      restartPolicy: Always

      schedulerName: default-scheduler

      priorityClassName: normal-priority

      imagePullSecrets:
        - name: dockerhub-secret

      nodeSelector:
        node-role: backend

      affinity:

        nodeAffinity:

          requiredDuringSchedulingIgnoredDuringExecution:

            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

            - weight: 100

              podAffinityTerm:

                topologyKey: kubernetes.io/hostname

                labelSelector:

                  matchLabels:
                    app: users-service

      topologySpreadConstraints:

        - maxSkew: 1

          topologyKey: kubernetes.io/hostname

          whenUnsatisfiable: ScheduleAnyway

          labelSelector:
            matchLabels:
              app: users-service

      securityContext:

        runAsNonRoot: true

        runAsUser: 1000

        runAsGroup: 1000

        fsGroup: 1000

      initContainers:

        - name: wait-for-db

          image: busybox:1.37

          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432
              do
                echo waiting...
                sleep 2
              done

      containers:

        - name: users-service

          image: myrepo/users-service:1.4.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:

            - name: APP_NAME
              value: users-service

            - name: LOG_LEVEL
              value: info

            - name: DB_HOST
              value: postgres

          envFrom:

            - configMapRef:
                name: users-config

            - secretRef:
                name: users-secret

          resources:

            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"

          startupProbe:

            httpGet:
              path: /health
              port: 8080

            failureThreshold: 30

            periodSeconds: 10

          readinessProbe:

            httpGet:
              path: /ready
              port: 8080

            initialDelaySeconds: 5

            periodSeconds: 5

            timeoutSeconds: 2

            failureThreshold: 3

          livenessProbe:

            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 30

            periodSeconds: 10

            timeoutSeconds: 2

            failureThreshold: 3

          lifecycle:

            preStop:

              exec:
                command:
                  - sh
                  - -c
                  - sleep 15

          securityContext:

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: true

            privileged: false

            capabilities:
              drop:
                - ALL

          volumeMounts:

            - name: config

              mountPath: /app/config

              readOnly: true

            - name: tmp

              mountPath: /tmp

      volumes:

        - name: config

          configMap:
            name: users-config

        - name: tmp

          emptyDir: {}